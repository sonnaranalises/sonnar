<nav class="categorias" id="categorias" {% if include.sem_titulo %}aria-label="Categorias"{% else %}aria-labelledby="categorias-titulo"{% endif %}>
  {% unless include.sem_titulo %}
  <h2 id="categorias-titulo">Categorias</h2>
  {% endunless %}
  <ul class="categorias-lista">
    {% for c in site.data.categorias %}
      {% assign n = site.posts | where: "categoria", c.slug | size %}
      {% if n > 0 %}
      <li><a href="{{ '/categorias/' | append: c.slug | append: '/' | relative_url }}">{{ c.nome }} <span class="categoria-contagem">({{ n }})</span></a></li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
