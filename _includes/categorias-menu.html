<nav class="categorias" id="categorias" aria-labelledby="categorias-titulo">
  <h2 id="categorias-titulo">Categorias</h2>
  <div class="categorias-grade">
    {% for c in site.data.categorias %}
      {% assign n = site.posts | where: "categoria", c.slug | size %}
      {% if n > 0 %}
      <a class="categoria-cartao" href="{{ '/categorias/' | append: c.slug | append: '/' | relative_url }}">
        <span class="categoria-nome">{{ c.nome }}</span>
        <span class="categoria-contagem">{% if n == 1 %}1 relatório{% else %}{{ n }} relatórios{% endif %}</span>
      </a>
      {% endif %}
    {% endfor %}
  </div>
</nav>
