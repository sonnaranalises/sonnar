{%- assign url = include.url | default: "" -%}
{%- assign prefix = url | slice: 0, 8 -%}
{%- if prefix == "https://" -%}
  <div class="affiliate-line">
    <a class="affiliate-link" href="{{ url | escape }}" target="_blank" rel="sponsored nofollow noopener">Ver no Mercado Livre<span class="sr-only"> (abre em uma nova aba)</span></a>
    <span class="affiliate-caption">Link de afiliado</span>
  </div>
{%- else -%}
  <p class="missing-link">Link de afiliado indisponível. Use um endereço https completo, sem encurtador.</p>
{%- endif -%}
