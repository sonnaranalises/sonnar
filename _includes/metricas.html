{%- assign post_slug = "" -%}
{%- if page.collection == "posts" -%}{%- assign post_slug = page.path | split: "/" | last | remove: ".md" -%}{%- endif -%}
<script>
  window.SONNAR_METRICAS = {
    url: {{ site.feedback.supabase_url | jsonify }},
    key: {{ site.feedback.anon_key | jsonify }},
    slug: {{ post_slug | jsonify }},
    host: "sonnaranalises.github.io"
  };
</script>
<script src="{{ '/assets/js/metricas.js' | relative_url }}" defer></script>
