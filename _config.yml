# Sonnar Análises — site estático (Jekyll).
# O site é servido em https://sonnaranalises.github.io/sonnar/
# Se a raiz mudar, ajuste `baseurl` (vazio "" quando o site estiver na raiz do domínio).

title: Sonnar Análises
slogan: Te ajudando a detectar boas escolhas
description: "Todo dia, um produto em destaque, com o que os compradores contam e o preço frente a produtos parecidos. Fatos organizados para escolher com mais clareza."
url: https://sonnaranalises.github.io
baseurl: /sonnar
lang: pt-BR
timezone: America/Sao_Paulo

# false esconde "Link de afiliado" e "Links de afiliado". true traz as legendas de volta.
legendas_afiliado: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

permalink: /radar/:year/:month/:day/:title/
future: false
excerpt_separator: "<!-- more -->"

exclude:
  - README.md
  - docs
  - modelos
  - script
  - vendor
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

