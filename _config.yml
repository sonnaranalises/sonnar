# Sonnar Análises — site estático (Jekyll).
# O site é servido em https://sonnaranalises.github.io/sonnar/
# Se a raiz mudar, ajuste `baseurl` (vazio "" quando o site estiver na raiz do domínio).

title: Sonnar Análises
slogan: Te ajudando a detectar boas escolhas
description: >-
  No Radar do dia, a Sonnar Análises reúne o que o produto oferece,
  o que aparece nas opiniões de quem comprou e como o preço se comportou.
url: https://sonnaranalises.github.io
baseurl: /sonnar
lang: pt-BR
timezone: America/Sao_Paulo

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

permalink: /radar/:year/:month/:day/:title/
future: false
excerpt_separator: "<!-- more -->"

exclude:
  - README.md
  - docs
  - modelos
  - script
  - vendor
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

